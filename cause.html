<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why You're My Girlfriend! 💖</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="./cause.css">
    <style>
       
    </style>
</head>
<body>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="container">
        <h1>Happy Birthday Eka 💖</h1>
        
        <div id="reasons-container"></div>
        
        <button class="shuffle-button">Click Here... 💕</button>
        <div class="reason-counter"></div>

        <div class="ending-section">
            <div class="teddy-hug">
                <img src="./d1.jpg" alt="Teddy Hug">
            </div>
            <div class="ending-text">You're the BESTEST ! 💖</div>
        </div>
    </div>

    <script src="cause.js"></script>

    <!-- YouTube Background Music Player -->
    <div id="player" style="display: none;"></div>
    
    <button id="music-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 999; padding: 10px 20px; font-size: 1rem; background: linear-gradient(45deg, #ff69b4, #da70d6); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);" onclick="toggleMusic()">
      ▶️ Play Music
    </button>

    <script>
      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          height: '0',
          width: '0',
          videoId: 'vhVBWw6rId0',
          playerVars: {
            'autoplay': 1,
            'loop': 1,
            'playlist': 'vhVBWw6rId0'
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      function onPlayerReady(event) {
        event.target.playVideo();
      }

      function onPlayerStateChange(event) {
        var btn = document.getElementById("music-btn");
        if (event.data == YT.PlayerState.PLAYING) {
          btn.innerHTML = "⏸️ Pause Music";
        } else {
          btn.innerHTML = "▶️ Play Music";
        }
      }

      function toggleMusic() {
        if (player && player.getPlayerState) {
          var state = player.getPlayerState();
          if (state == YT.PlayerState.PLAYING || state == YT.PlayerState.BUFFERING) {
            player.pauseVideo();
          } else {
            player.playVideo();
          }
        }
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
